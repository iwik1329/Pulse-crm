<path class="edge" d="M975 135.0 L1015 135.0"/>
<path class="edge" d="M1065 135.0 L1145 135.0"/>
<text class="flowlabel" x="1105.0" y="128.0">да</text>
<path class="edge" d="M1040.0 160 L1040.0 275"/>
