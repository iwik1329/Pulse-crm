<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 315" role="img" aria-labelledby="title desc">
<title id="title">Путь заявки в целевой CRM</title>
<desc id="desc">Заявка, первый контакт за 15 минут, предложение и повтор, итог сделки</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082858"/><stop offset="1" stop-color="#071a3d"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153d73"/><stop offset="1" stop-color="#0d2a54"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#6caefa" stroke-width="2"/></marker>
</defs>
<style>text{font-family:Arial,sans-serif;fill:#fff}.heading{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#a7bfdf}.num{font-size:12px;font-weight:700;fill:#75b4ff}.cardTitle{font-size:18px;font-weight:700}.cardSub{font-size:12px;fill:#a6c1e0}.arrow{stroke:#6caefa;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="1000" height="315" rx="20" fill="url(#bg)"/>
<text class="heading" x="33" y="48">От заявки до результата</text><text class="sub" x="33" y="72">Целевой процесс с контролем следующего действия на каждом этапе</text>
<g>
  <rect x="32" y="112" width="205" height="150" rx="14" fill="url(#card)" stroke="#2a5d99"/>
  <text class="num" x="51" y="141">01 · ПОСТУПЛЕНИЕ</text><text class="cardTitle" x="51" y="176">Карточка лида</text><text class="cardSub" x="51" y="204">Единая точка учёта</text><text class="cardSub" x="51" y="224">и ответственный</text>
  <path class="arrow" d="M240 187H266"/>
  <rect x="274" y="112" width="205" height="150" rx="14" fill="url(#card)" stroke="#2a5d99"/>
  <text class="num" x="293" y="141">02 · ПЕРВЫЙ КОНТАКТ</text><text class="cardTitle" x="293" y="176">Задача за 15 мин</text><text class="cardSub" x="293" y="204">Срок реакции и очередь</text><text class="cardSub" x="293" y="224">просроченных</text>
  <path class="arrow" d="M482 187H508"/>
  <rect x="516" y="112" width="205" height="150" rx="14" fill="url(#card)" stroke="#2a5d99"/>
  <text class="num" x="535" y="141">03 · РАЗВИТИЕ СДЕЛКИ</text><text class="cardTitle" x="535" y="176">КП и повтор</text><text class="cardSub" x="535" y="204">Автоматические задачи</text><text class="cardSub" x="535" y="224">при смене этапа</text>
  <path class="arrow" d="M724 187H750"/>
  <rect x="758" y="112" width="210" height="150" rx="14" fill="url(#card)" stroke="#2a5d99"/>
  <text class="num" x="777" y="141">04 · РЕЗУЛЬТАТ</text><text class="cardTitle" x="777" y="176">Закрытая сделка</text><text class="cardSub" x="777" y="204">Исход в воронке</text><text class="cardSub" x="777" y="224">и отчётах</text>
</g>
<text x="33" y="291" class="sub">AS-IS → TO-BE · BPMN 2.0 · UML · требования · KPI · экономика · прототип</text>
</svg>
