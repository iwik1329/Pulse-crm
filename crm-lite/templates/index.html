<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пульс CRM</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">◈</span><span>Пульс<span class="brand-light"> CRM</span></span></div>
      <div class="workspace-tag">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav class="nav" aria-label="Основное меню">
        <button class="nav-link active" data-view="dashboard"><span class="nav-icon">▦</span>Обзор</button>
        <button class="nav-link" data-view="leads"><span class="nav-icon">♙</span>Клиенты</button>
        <button class="nav-link" data-view="pipeline"><span class="nav-icon">▤</span>Сделки</button>
        <button class="nav-link" data-view="reports"><span class="nav-icon">◫</span>Отчёты</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-pill"><span class="local-dot"></span>Локальная версия</div>
        <p>Данные хранятся на этом компьютере</p>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">Рабочее пространство <span>/</span> <strong id="breadcrumb">Обзор</strong></div>
        <div class="top-actions"><span class="today" id="today"></span><button class="button button-primary" id="addLeadTop">＋ Добавить клиента</button></div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="leadDialog" class="dialog">
    <form id="leadForm" class="dialog-panel">
      <div class="dialog-head"><div><div class="eyebrow">КАРТОЧКА КЛИЕНТА</div><h2 id="dialogTitle">Новый клиент</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="Закрыть">×</button></div>
      <div class="form-grid">
        <label>Имя <span>*</span><input name="name" required maxlength="250" placeholder="Например, Анна Иванова"></label>
        <label>Компания<input name="company" maxlength="250" placeholder="Название компании"></label>
        <label>Email<input name="email" type="email" maxlength="250" placeholder="name@company.ru"></label>
        <label>Телефон<input name="phone" maxlength="250" placeholder="+7 ..."></label>
        <label>Источник<input name="source" maxlength="250" placeholder="Сайт, рекомендация..."></label>
        <label>Отрасль<input name="industry" maxlength="250" placeholder="Отрасль"></label>
        <label>Страна<input name="country" maxlength="250" placeholder="Страна"></label>
        <label>Ответственный<input name="assignee" maxlength="250" placeholder="Имя сотрудника"></label>
        <label>Статус<select name="status"><option>Новый</option><option>В работе</option><option>Квалифицирован</option><option>Выигран</option><option>Проигран</option></select></label>
        <label>Этап сделки<select name="stage"><option>Поиск</option><option>Квалификация</option><option>Предложение</option><option>Переговоры</option><option>Успешно</option><option>Отказ</option></select></label>
        <label>Сумма сделки<input name="amount" type="number" min="0" step="0.01" value="0"></label>
        <label>Вероятность, %<input name="probability" type="number" min="0" max="100" step="1" value="0"></label>
        <label>Дата закрытия<input name="close_date" type="date"></label>
        <label>Напомнить<input name="follow_up" type="date"></label>
        <label>Приоритет<select name="priority"><option>Средний</option><option>Высокий</option><option>Низкий</option></select></label>
        <label>Оценка клиента, 0–10<input name="satisfaction" type="number" min="0" max="10" step="0.1" placeholder="Не указана"></label>
        <label>Статус обращения<select name="case_status"><option value="">Нет обращения</option><option>Открыт</option><option>В работе</option><option>Закрыт</option></select></label>
      </div>
      <div id="notesSection" class="notes-section" hidden><h3>Заметки</h3><div id="notesList"></div><div class="note-entry"><input id="noteInput" maxlength="2000" placeholder="Добавить заметку"><button type="button" class="button button-muted" id="addNote">Добавить</button></div></div>
      <div class="dialog-actions"><button type="button" class="button button-danger" id="deleteLead" hidden>Удалить</button><span class="spacer"></span><button type="button" class="button button-muted" id="cancelDialog">Отмена</button><button type="submit" class="button button-primary">Сохранить</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
